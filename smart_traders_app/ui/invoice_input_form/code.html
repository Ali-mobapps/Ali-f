<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Invoice Input - ProTrade Ledger</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=JetBrains+Mono:wght@500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "error-container": "#ffdad6",
                      "on-primary-fixed": "#001a42",
                      "surface-container-low": "#f0f3ff",
                      "surface-container": "#e7eeff",
                      "on-error": "#ffffff",
                      "tertiary-fixed-dim": "#c4c7c9",
                      "primary-fixed": "#d8e2ff",
                      "surface-container-highest": "#d8e3fb",
                      "surface-variant": "#d8e3fb",
                      "outline": "#75777f",
                      "tertiary": "#010203",
                      "on-secondary-fixed": "#410002",
                      "secondary-fixed-dim": "#ffb4ab",
                      "on-tertiary-fixed-variant": "#444749",
                      "surface-container-high": "#dee8ff",
                      "outline-variant": "#c5c6d0",
                      "tertiary-container": "#1a1d1f",
                      "error": "#ba1a1a",
                      "on-primary-fixed-variant": "#314671",
                      "primary": "#00020a",
                      "background": "#f9f9ff",
                      "on-surface": "#111c2d",
                      "secondary-container": "#e02929",
                      "inverse-on-surface": "#ecf1ff",
                      "on-secondary": "#ffffff",
                      "on-primary-container": "#7084b3",
                      "on-secondary-fixed-variant": "#93000d",
                      "inverse-primary": "#b1c6f9",
                      "on-error-container": "#93000a",
                      "on-tertiary-fixed": "#191c1e",
                      "tertiary-fixed": "#e0e3e5",
                      "primary-fixed-dim": "#b1c6f9",
                      "surface": "#f9f9ff",
                      "on-tertiary": "#ffffff",
                      "on-primary": "#ffffff",
                      "inverse-surface": "#263143",
                      "surface-bright": "#f9f9ff",
                      "surface-container-lowest": "#ffffff",
                      "secondary": "#bb0114",
                      "on-background": "#111c2d",
                      "surface-tint": "#495e8a",
                      "on-secondary-container": "#fffbff",
                      "primary-container": "#001b44",
                      "surface-dim": "#cfdaf2",
                      "on-surface-variant": "#44474f",
                      "on-tertiary-container": "#828587",
                      "secondary-fixed": "#ffdad6"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {
                      "grid-gutter": "0.75rem",
                      "table-cell-padding": "0.75rem 0.5rem",
                      "input-padding": "1rem",
                      "stack-gap": "1.5rem",
                      "container-margin": "1rem"
              },
              "fontFamily": {
                      "data-tabular": [
                              "JetBrains Mono"
                      ],
                      "label-caps": [
                              "JetBrains Mono"
                      ],
                      "body-lg": [
                              "Hanken Grotesk"
                      ],
                      "headline-md": [
                              "Hanken Grotesk"
                      ],
                      "body-sm": [
                              "Hanken Grotesk"
                      ],
                      "headline-lg": [
                              "Hanken Grotesk"
                      ],
                      "headline-lg-mobile": [
                              "Hanken Grotesk"
                      ]
              },
              "fontSize": {
                      "data-tabular": [
                              "14px",
                              {
                                      "lineHeight": "20px",
                                      "fontWeight": "500"
                              }
                      ],
                      "label-caps": [
                              "12px",
                              {
                                      "lineHeight": "16px",
                                      "letterSpacing": "0.05em",
                                      "fontWeight": "600"
                              }
                      ],
                      "body-lg": [
                              "16px",
                              {
                                      "lineHeight": "24px",
                                      "fontWeight": "400"
                              }
                      ],
                      "headline-md": [
                              "20px",
                              {
                                      "lineHeight": "28px",
                                      "fontWeight": "600"
                              }
                      ],
                      "body-sm": [
                              "14px",
                              {
                                      "lineHeight": "20px",
                                      "fontWeight": "400"
                              }
                      ],
                      "headline-lg": [
                              "32px",
                              {
                                      "lineHeight": "40px",
                                      "fontWeight": "700"
                              }
                      ],
                      "headline-lg-mobile": [
                              "24px",
                              {
                                      "lineHeight": "32px",
                                      "fontWeight": "700"
                              }
                      ]
              }
      },
          },
        }
      </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        
        /* Input focus styles */
        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: theme('colors.primary');
            border-width: 2px;
            box-shadow: none;
        }
      </style>
</head>
<body class="flex flex-col min-h-screen bg-background text-on-background pb-24">
<!-- TopAppBar -->
<header class="bg-surface-container-lowest text-primary flex justify-between items-center w-full px-grid-gutter h-16 border-b-2 border-primary sticky top-0 z-40 shadow-sm">
<button aria-label="Menu" class="text-primary hover:bg-surface-container-low transition-colors p-2 rounded-full">
<span class="material-symbols-outlined">menu</span>
</button>
<h1 class="font-headline-md text-headline-md font-bold text-primary">ProTrade Ledger</h1>
<button aria-label="Account" class="text-primary hover:bg-surface-container-low transition-colors p-2 rounded-full">
<span class="material-symbols-outlined">account_circle</span>
</button>
</header>
<main class="flex-grow flex flex-col items-center pt-6 px-4 md:px-8">
<div class="w-full max-w-3xl space-y-stack-gap">
<div class="flex items-center justify-between mb-4">
<h2 class="font-headline-lg-mobile md:font-headline-lg text-headline-lg-mobile md:text-headline-lg text-primary">New Invoice</h2>
</div>
<!-- Client Info Section -->
<section class="bg-surface p-6 border border-outline-variant rounded-lg space-y-4">
<h3 class="font-headline-md text-headline-md text-primary border-b border-outline-variant pb-2 mb-4">Client Information</h3>
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-1" for="clientName">Delivered To</label>
<input class="bg-surface-container-lowest border border-outline-variant rounded p-input-padding font-body-lg text-body-lg w-full text-on-surface" id="clientName" placeholder="e.g. Ijaz Ahmad" type="text"/>
</div>
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-1" for="date">Date</label>
<input class="bg-surface-container-lowest border border-outline-variant rounded p-input-padding font-body-lg text-body-lg w-full text-on-surface" id="date" type="date" value="2026-08-16"/>
</div>
<div class="flex flex-col md:col-span-2">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-1" for="address">Address</label>
<input class="bg-surface-container-lowest border border-outline-variant rounded p-input-padding font-body-lg text-body-lg w-full text-on-surface" id="address" placeholder="e.g. Mian Chanu" type="text"/>
</div>
</div>
</section>
<!-- Invoice Metadata -->
<section class="bg-surface p-6 border border-outline-variant rounded-lg space-y-4">
<h3 class="font-headline-md text-headline-md text-primary border-b border-outline-variant pb-2 mb-4">Invoice Metadata</h3>
<div class="grid grid-cols-2 md:grid-cols-4 gap-4">
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-1" for="invoiceNo">Invoice #</label>
<input class="bg-surface-container-lowest border border-outline-variant rounded p-input-padding font-data-tabular text-data-tabular w-full text-primary" id="invoiceNo" placeholder="468" type="text"/>
</div>
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-1" for="dcNo">DC #</label>
<input class="bg-surface-container-lowest border border-outline-variant rounded p-input-padding font-data-tabular text-data-tabular w-full text-primary" id="dcNo" placeholder="466" type="text"/>
</div>
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-1" for="orderNo">Order #</label>
<input class="bg-surface-container-lowest border border-outline-variant rounded p-input-padding font-data-tabular text-data-tabular w-full text-primary" id="orderNo" placeholder="" type="text"/>
</div>
<div class="flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-1" for="dcNo2">DC # 2</label>
<input class="bg-surface-container-lowest border border-outline-variant rounded p-input-padding font-data-tabular text-data-tabular w-full text-primary" id="dcNo2" placeholder="82087" type="text"/>
</div>
</div>
</section>
<!-- Items Section -->
<section class="bg-surface p-6 border border-outline-variant rounded-lg space-y-4">
<div class="flex justify-between items-center border-b border-outline-variant pb-2 mb-4">
<h3 class="font-headline-md text-headline-md text-primary">Dispatch Information</h3>
<button class="bg-surface-container-highest text-primary hover:bg-primary hover:text-on-primary border border-primary px-4 py-2 rounded transition-colors flex items-center gap-2 font-label-caps text-label-caps">
<span class="material-symbols-outlined text-sm">add</span> Add Item
                    </button>
</div>
<!-- Item Card 1 -->
<div class="bg-surface-container-lowest border border-outline-variant rounded p-4 relative">
<button aria-label="Remove item" class="absolute top-2 right-2 text-error hover:bg-error-container p-1 rounded transition-colors">
<span class="material-symbols-outlined text-sm">close</span>
</button>
<div class="grid grid-cols-1 md:grid-cols-12 gap-4">
<div class="md:col-span-4 flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-1">Product Name</label>
<input class="border border-outline-variant rounded p-2 font-body-lg text-body-lg w-full text-on-surface" type="text" value="Medivit-C"/>
</div>
<div class="md:col-span-2 flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-1">Packing</label>
<input class="border border-outline-variant rounded p-2 font-body-lg text-body-lg w-full text-on-surface" type="text" value="1kg"/>
</div>
<div class="md:col-span-2 flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-1">Qty</label>
<input class="border border-outline-variant rounded p-2 font-data-tabular text-data-tabular w-full text-right" type="text" value="12kg"/>
</div>
<div class="md:col-span-2 flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-1">Unit Rate</label>
<input class="border border-outline-variant rounded p-2 font-data-tabular text-data-tabular w-full text-right text-primary" type="number" value="2250"/>
</div>
<div class="md:col-span-2 flex flex-col justify-end">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-1 md:hidden">Amount</label>
<div class="bg-surface-container-low border border-outline-variant rounded p-2 font-data-tabular text-data-tabular w-full text-right font-bold text-primary">27000</div>
</div>
</div>
</div>
<!-- Item Card 2 -->
<div class="bg-surface-container-lowest border border-outline-variant rounded p-4 relative">
<button aria-label="Remove item" class="absolute top-2 right-2 text-error hover:bg-error-container p-1 rounded transition-colors">
<span class="material-symbols-outlined text-sm">close</span>
</button>
<div class="grid grid-cols-1 md:grid-cols-12 gap-4">
<div class="md:col-span-4 flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-1">Product Name</label>
<input class="border border-outline-variant rounded p-2 font-body-lg text-body-lg w-full text-on-surface" type="text" value="Livocina"/>
</div>
<div class="md:col-span-2 flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-1">Packing</label>
<input class="border border-outline-variant rounded p-2 font-body-lg text-body-lg w-full text-on-surface" type="text" value="5 liter"/>
</div>
<div class="md:col-span-2 flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-1">Qty</label>
<input class="border border-outline-variant rounded p-2 font-data-tabular text-data-tabular w-full text-right" type="text" value="10 liter"/>
</div>
<div class="md:col-span-2 flex flex-col">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-1">Unit Rate</label>
<input class="border border-outline-variant rounded p-2 font-data-tabular text-data-tabular w-full text-right text-primary" type="number" value="2250"/>
</div>
<div class="md:col-span-2 flex flex-col justify-end">
<label class="font-label-caps text-label-caps text-on-surface-variant mb-1 md:hidden">Amount</label>
<div class="bg-surface-container-low border border-outline-variant rounded p-2 font-data-tabular text-data-tabular w-full text-right font-bold text-primary">22500</div>
</div>
</div>
</div>
</section>
<!-- Action Area -->
<div class="pt-4 pb-8 flex flex-col md:flex-row gap-4 justify-end">
<button class="bg-transparent border border-primary text-primary px-6 py-3 rounded font-label-caps text-label-caps hover:bg-surface-container-low transition-colors w-full md:w-auto">
                    Save Draft
                </button>
<button class="bg-primary text-on-primary px-8 py-3 rounded font-label-caps text-label-caps hover:opacity-90 transition-opacity w-full md:w-auto shadow-sm flex items-center justify-center gap-2">
<span class="material-symbols-outlined">visibility</span> Preview Invoice
                </button>
</div>
</div>
</main>
<!-- BottomNavBar (Mobile Only) -->
<nav class="md:hidden bg-surface text-primary fixed bottom-0 left-0 w-full h-16 flex justify-around items-stretch overflow-hidden border-t-2 border-primary z-50">
<button aria-label="Input" class="flex flex-col items-center justify-center bg-primary text-on-primary w-full h-full">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">edit_note</span>
<span class="font-label-caps text-[10px] mt-1">Input</span>
</button>
<button aria-label="Preview" class="flex flex-col items-center justify-center text-on-surface-variant w-full h-full hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">visibility</span>
<span class="font-label-caps text-[10px] mt-1">Preview</span>
</button>
<button aria-label="Export" class="flex flex-col items-center justify-center text-on-surface-variant w-full h-full hover:bg-surface-container-high transition-colors">
<span class="material-symbols-outlined">picture_as_pdf</span>
<span class="font-label-caps text-[10px] mt-1">Export</span>
</button>
</nav>
</body></html>
