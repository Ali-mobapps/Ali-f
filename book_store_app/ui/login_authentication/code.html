<!DOCTYPE html>

                      "surface-container-low": "#f0f3ff",

              "spacing": {
                      "container-padding": "24px",
                      "stack-comfortable": "16px",
                      "stack-dense": "8px",
                      "gutter": "16px",
                      "unit": "4px"
              },
              "fontFamily": {
                      "body-md": [
                              "Inter"
                      ],
                      "body-sm": [

<body class="bg-surface text-on-surface h-screen w-full flex items-center justify-center font-body-md text-body-md">
<div class="relative w-full max-w-md mx-container-padding">
<div class="absolute inset-0 bg-gradient-to-br from-primary-fixed to-surface-container-high transform -skew-y-3 rounded-xl shadow-sm z-0"></div>
<main class="relative bg-surface-container-lowest border border-outline-variant rounded-xl shadow-lg z-10 overflow-hidden flex flex-col">
<header class="bg-surface-container py-stack-comfortable px-container-padding border-b border-outline-variant flex flex-col items-center justify-center text-center">
<div class="w-12 h-12 bg-primary rounded-lg flex items-center justify-center mb-stack-dense">
<span class="material-symbols-outlined text-on-primary text-2xl" style="font-variation-settings: 'FILL' 1;">local_library</span>
</div>
<h1 class="font-headline-md text-headline-md text-primary m-0">Local Shop Store Manager</h1>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-unit">Secure Admin Access</p>
</header>
<section class="p-container-padding flex-1">
<form class="flex flex-col gap-stack-comfortable">
<div class="flex flex-col gap-unit">
<label class="font-label-mono text-label-mono text-on-surface uppercase tracking-wider" for="username">Username or Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-sm">person</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary text-on-surface font-body-md text-body-md pl-10 pr-3 py-2 transition-colors" id="username" placeholder="admin@store.local" required="" type="text"/>
</div>
</div>
<div class="flex flex-col gap-unit">
<label class="font-label-mono text-label-mono text-on-surface uppercase tracking-wider" for="password">Password</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant text-sm">lock</span>
<input class="w-full bg-surface-container-lowest border border-outline-variant rounded focus:border-primary focus:ring-1 focus:ring-primary text-on-surface font-body-md text-body-md pl-10 pr-10 py-2 transition-colors" id="password" placeholder="••••••••" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined text-sm">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between mt-unit">
<label class="flex items-center gap-2 cursor-pointer group">
<input class="w-4 h-4 rounded border-outline-variant text-primary focus:ring-primary bg-surface-container-lowest cursor-pointer" type="checkbox"/>
<span class="font-body-sm text-body-sm text-on-surface-variant group-hover:text-primary transition-colors">Remember Me</span>
</label>
<a class="font-body-sm text-body-sm text-primary hover:underline font-semibold" href="#">Reset PIN/Password</a>
</div>
<button class="w-full mt-stack-dense bg-primary text-on-primary font-title-sm text-title-sm py-3 px-4 rounded hover:bg-surface-tint focus:ring-2 focus:ring-primary focus:ring-offset-2 transition-all flex items-center justify-center gap-2 group" type="submit">
                        Login to Dashboard
                        <span class="material-symbols-outlined text-sm group-hover:translate-x-1 transition-transform">arrow_forward</span>
</button>
</form>
</section>
<footer class="bg-surface-container-low py-3 px-container-padding border-t border-outline-variant text-center">
<p class="font-body-sm text-body-sm text-on-surface-variant">System v2.4.0 • Requires secure connection</p>
</footer>
</main>
</div>
</body></html>
