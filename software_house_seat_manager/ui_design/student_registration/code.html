<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Student Registration</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700&amp;family=Geist:wght@500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        "colors": {
                "surface-variant": "#cfe6f2",
                "on-error": "#ffffff",
                "outline-variant": "#c6c5d4",
                "surface-dim": "#c7dde9",
                "on-tertiary": "#ffffff",
                "tertiary-fixed": "#69ff87",
                "surface-bright": "#f3faff",
                "tertiary": "#002108",
                "on-primary-container": "#8690ee",
                "on-background": "#071e27",
                "surface-container-highest": "#cfe6f2",
                "on-primary-fixed": "#000767",
                "surface-tint": "#4c56af",
                "primary-fixed-dim": "#bdc2ff",
                "on-tertiary-fixed-variant": "#00531e",
                "primary-container": "#1a237e",
                "error": "#ba1a1a",
                "on-secondary-fixed-variant": "#00429b",
                "on-primary-fixed-variant": "#343d96",
                "secondary-fixed-dim": "#b0c6ff",
                "outline": "#767683",
                "surface-container-lowest": "#ffffff",
                "on-primary": "#ffffff",
                "inverse-primary": "#bdc2ff",
                "secondary-fixed": "#d9e2ff",
                "on-error-container": "#93000a",
                "primary-fixed": "#e0e0ff",
                "surface": "#f3faff",
                "inverse-on-surface": "#dff4ff",
                "surface-container-high": "#d5ecf8",
                "on-secondary": "#ffffff",
                "secondary": "#0056c5",
                "secondary-container": "#0f6df3",
                "on-secondary-fixed": "#001945",
                "background": "#f3faff",
                "on-tertiary-fixed": "#002108",
                "surface-container-low": "#e6f6ff",
                "on-surface-variant": "#454652",
                "on-secondary-container": "#fefcff",
                "tertiary-fixed-dim": "#3ce36a",
                "primary": "#000666",
                "inverse-surface": "#1e333c",
                "surface-container": "#dbf1fe",
                "on-tertiary-container": "#00b048",
                "error-container": "#ffdad6",
                "on-surface": "#071e27",
                "tertiary-container": "#003912"
        },
        "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
        },
        "spacing": {
          "safe-top": "env(safe-area-inset-top)",
          "safe-bottom": "env(safe-area-inset-bottom)"
        },
        "fontFamily": {
                "headline": [
                        "Hanken Grotesk", "sans-serif"
                ],
                "body": [
                        "Hanken Grotesk", "sans-serif"
                ],
                "label": [
                        "Geist", "monospace"
                ]
        }
    }
  }
}
</script>
<style>
  body {
    -webkit-tap-highlight-color: transparent;
    font-family: 'Hanken Grotesk', sans-serif;
  }
  
  /* Custom form styles */
  .floating-input:focus-within label,
  .floating-input input:not(:placeholder-shown) + label {
    transform: translateY(-140%) scale(0.85);
    color: theme('colors.secondary');
  }
  
  .floating-input input:not(:placeholder-shown) ~ .input-border {
    border-color: theme('colors.secondary');
  }
</style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col font-body selection:bg-secondary/20 selection:text-secondary">
<!-- TopAppBar -->
<header class="bg-surface border-b border-outline-variant/30 w-full top-0 sticky z-40 pt-safe-top">
<div class="flex justify-between items-center px-4 py-3 w-full h-16">
<button aria-label="Go back" class="text-primary hover:bg-surface-container-high transition-colors active:scale-95 duration-150 p-2 rounded-full flex items-center justify-center -ml-2" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="font-headline text-headline-md font-bold text-primary flex-1 text-center pr-8">
        Kinetic Grid
      </div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col px-4 pt-6 pb-24 max-w-lg mx-auto w-full relative z-10">
<div class="mb-8">
<h1 class="font-headline text-headline-lg font-bold text-on-surface mb-2 tracking-tight">Student Registration</h1>
<p class="font-body text-body-md text-on-surface-variant">Complete your profile to request access to the facility. All fields are required.</p>
</div>
<!-- Progress Indicator -->
<div class="flex items-center mb-8 px-2">
<div class="flex-1">
<div class="h-2 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-secondary w-1/3 rounded-full transition-all duration-500 ease-out"></div>
</div>
</div>
<span class="font-label text-label-sm text-secondary ml-4 whitespace-nowrap">Step 1 of 3</span>
</div>
<!-- Form Container (Card) -->
<div class="bg-surface-container-lowest rounded-lg border border-outline-variant/20 shadow-sm p-6 mb-6">
<form class="flex flex-col gap-6" id="registrationForm">
<!-- Full Name Field -->
<div class="relative floating-input bg-surface-bright rounded-lg pt-6 pb-2 px-4 border-b-2 border-outline-variant/50 focus-within:border-secondary transition-colors group">
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-body text-body-lg text-on-surface placeholder-transparent peer z-10 relative" id="fullName" name="fullName" placeholder=" " required="" type="text"/>
<label class="absolute left-4 top-1/2 -translate-y-1/2 font-label text-label-md text-on-surface-variant transition-all duration-200 pointer-events-none origin-left z-0" for="fullName">Full Name</label>
</div>
<!-- University ID Field -->
<div class="relative floating-input bg-surface-bright rounded-lg pt-6 pb-2 px-4 border-b-2 border-outline-variant/50 focus-within:border-secondary transition-colors group">
<input class="w-full bg-transparent border-none p-0 focus:ring-0 font-body text-body-lg text-on-surface placeholder-transparent peer z-10 relative" id="uniId" name="uniId" placeholder=" " required="" type="text"/>
<label class="absolute left-4 top-1/2 -translate-y-1/2 font-label text-label-md text-on-surface-variant transition-all duration-200 pointer-events-none origin-left z-0" for="uniId">University ID (e.g. S1234567)</label>
</div>
<!-- Department Select -->
<div class="relative bg-surface-bright rounded-lg pt-6 pb-2 px-4 border-b-2 border-outline-variant/50 focus-within:border-secondary transition-colors">
<label class="absolute left-4 top-2 font-label text-label-md text-secondary transition-all duration-200 pointer-events-none origin-left transform scale-85" for="department">Department</label>
<select class="w-full bg-transparent border-none p-0 focus:ring-0 font-body text-body-lg text-on-surface appearance-none z-10 relative cursor-pointer pr-8" id="department" name="department" required="">
<option class="text-on-surface-variant" disabled="" selected="" value="">Select Department...</option>
<option value="cs">Computer Science</option>
<option value="eng">Engineering</option>
<option value="sci">Physical Sciences</option>
<option value="arts">Arts &amp; Humanities</option>
</select>
<div class="absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">expand_more</span>
</div>
</div>
<!-- Photo Upload Area -->
<div class="mt-2">
<label class="font-label text-label-md text-on-surface mb-2 block">ID Photo (Required for access card)</label>
<div class="border-2 border-dashed border-outline-variant/60 rounded-lg bg-surface-bright p-8 flex flex-col items-center justify-center text-center cursor-pointer hover:bg-surface-container-low transition-colors group">
<div class="w-16 h-16 rounded-full bg-surface-variant flex items-center justify-center mb-4 group-hover:bg-primary-container transition-colors group-hover:text-on-primary-container text-primary">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 0;">add_a_photo</span>
</div>
<span class="font-body text-body-md text-on-surface font-semibold mb-1">Tap to upload or take a photo</span>
<span class="font-body text-body-sm text-on-surface-variant text-sm">JPEG or PNG, max 5MB. Clear headshot against a neutral background.</span>
<input accept="image/jpeg, image/png" class="hidden" id="idPhoto" name="idPhoto" type="file"/>
</div>
</div>
</form>
</div>
<!-- Action Button (Sticky Bottom on Mobile) -->
<div class="mt-auto pt-4 sticky bottom-6 z-20 pb-safe-bottom">
<button class="w-full bg-primary text-on-primary font-headline text-headline-sm font-semibold py-4 px-6 rounded-lg shadow-md hover:shadow-lg active:scale-[0.98] transition-all duration-200 flex justify-center items-center gap-2" type="button">
        Continue
        <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</div>
</main>
</body></html>
