name: zerenweb
description: "ZEREN Watches: Flutter-Based E-Commerce Mobile Application with SQLite Database and Google Drive Backup & Restore."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.2
  provider: ^6.1.2
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  http: ^1.2.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
