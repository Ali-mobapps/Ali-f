name: upzet
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  get: ^4.6.6
  shared_preferences: ^2.3.2
  google_maps_flutter: ^2.9.0
  url_launcher: ^6.3.1
  google_fonts: ^8.2.1
  flutter_quill: ^11.0.0
  url_strategy: ^0.3.0
  remixicon: ^4.9.3
  video_player: ^2.9.2
  shimmer: ^3.0.0
  intl: ^0.20.2
  syncfusion_flutter_charts: ^28.1.38
  syncfusion_flutter_core: ^28.1.38
  syncfusion_flutter_sliders: ^28.1.38
  flutter_colorpicker: ^1.1.0
  syncfusion_flutter_maps: ^28.1.38
  file_picker: ^8.1.3
  syncfusion_flutter_calendar: ^28.1.38
  # material_design_icons_flutter: ^7.0.7296
  font_awesome_flutter: ^11.0.0
  percent_indicator: ^4.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  font_awesome_flutter: ^11.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/brands/
    - assets/flags/
    - assets/small/
    - assets/users/
    - assets/
    - assets/data/
    - assets/lang/
