<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Dynetix - Admin Login</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@600;700&amp;family=Inter:wght@400&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-primary-fixed-variant": "#574500",
                        "on-primary": "#3c2f00",
                        "secondary-fixed": "#f0e0c8",
                        "tertiary-container": "#97b0ff",
                        "on-secondary-fixed-variant": "#4f4533",
                        "surface-bright": "#3a3939",
                        "on-secondary": "#382f1e",
                        "on-tertiary-fixed-variant": "#27438a",
                        "error-container": "#93000a",
                        "error": "#ffb4ab",
                        "inverse-surface": "#e5e2e1",
                        "outline": "#99907c",
                        "soft-ivory": "#F7E7CE",
                        "on-secondary-fixed": "#221b0b",
                        "champagne-gold": "#D4AF37",
                        "surface-container": "#201f1f",
                        "on-secondary-container": "#c5b79f",
                        "surface-container-highest": "#353534",
                        "surface-dim": "#131313",
                        "surface-container-high": "#2a2a2a",
                        "surface": "#131313",
                        "on-tertiary-fixed": "#00174b",
                        "on-background": "#e5e2e1",
                        "on-surface": "#e5e2e1",
                        "background": "#131313",
                        "tertiary-fixed-dim": "#b4c5ff",
                        "on-tertiary-container": "#254188",
                        "surface-variant": "#353534",
                        "primary": "#f2ca50",
                        "outline-variant": "#4d4635",
                        "secondary-fixed-dim": "#d3c5ad",
                        "surface-tint": "#e9c349",
                        "secondary": "#d3c5ad",
                        "glass-border": "rgba(255, 255, 255, 0.1)",
                        "inverse-on-surface": "#313030",
                        "charcoal-depth": "#1A1A1A",
                        "surface-container-low": "#1c1b1b",
                        "on-error": "#690005",
                        "on-primary-container": "#554300",
                        "tertiary": "#bfcdff",
                        "on-error-container": "#ffdad6",
                        "primary-fixed-dim": "#e9c349",
                        "surface-container-lowest": "#0e0e0e",
                        "on-tertiary": "#082b72",
                        "obsidian": "#0A0A0A",
                        "on-surface-variant": "#d0c5af",
                        "primary-fixed": "#ffe088",
                        "tertiary-fixed": "#dbe1ff",
                        "inverse-primary": "#735c00",
                        "primary-container": "#d4af37",
                        "secondary-container": "#524835",
                        "on-primary-fixed": "#241a00"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "spacing": {
                        "margin-mobile": "20px",
                        "gutter": "24px",
                        "unit": "8px",
                        "container-max": "1280px",
                        "section-gap": "120px"
                    },
                    "fontFamily": {
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "body-md": ["Inter"],
                        "headline-lg": ["Hanken Grotesk"],
                        "label-sm": ["JetBrains Mono"],
                        "headline-xl": ["Hanken Grotesk"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "headline-lg-mobile": ["32px", { "lineHeight": "1.2", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "1.6", "fontWeight": "400" }],
                        "headline-lg": ["40px", { "lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "label-sm": ["12px", { "lineHeight": "1.0", "letterSpacing": "0.1em", "fontWeight": "500" }],
                        "headline-xl": ["64px", { "lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "1.6", "fontWeight": "400" }]
                    }
                },
            },
        }
    </script>
<style>
        .input-underline {
            position: relative;
        }
        .input-underline::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 1px;
            background-color: #D4AF37;
            transition: all 0.3s ease-in-out;
        }
        .input-underline:focus-within::after {
            width: 100%;
            left: 0;
        }
        
        .ambient-glow {
            box-shadow: 0 0 40px rgba(212, 175, 55, 0.05);
        }
        .ambient-glow-active:hover {
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.15);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-obsidian text-on-surface min-h-screen flex flex-col items-center justify-center relative overflow-hidden font-body-md text-body-md">
<!-- Ambient Background Lighting -->
<div class="absolute top-0 left-1/2 -translate-x-1/2 w-[800px] h-[800px] bg-champagne-gold/5 rounded-full blur-[120px] pointer-events-none"></div>
<main class="w-full max-w-md px-margin-mobile relative z-10 flex flex-col items-center">
<!-- Brand / Header -->
<div class="mb-12 text-center">
<h1 class="font-headline-xl text-headline-xl text-champagne-gold tracking-tighter">DYNETIX</h1>
<p class="font-label-sm text-label-sm text-on-surface-variant mt-2 uppercase tracking-widest">Admin Portal</p>
</div>
<!-- Login Card -->
<div class="w-full bg-charcoal-depth/80 backdrop-blur-2xl rounded-xl border border-glass-border p-8 ambient-glow">
<form class="space-y-8" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="input-underline">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="email">Email Address</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-0 text-on-surface-variant text-lg">mail</span>
<input class="w-full bg-transparent border-0 border-b border-glass-border text-on-surface pl-8 pr-4 py-3 focus:ring-0 focus:border-transparent placeholder-on-surface-variant/50 font-body-md text-body-md" id="email" placeholder="Enter administrator email" type="email" value="admin@dynetix.com"/>
</div>
</div>
<!-- Password Field -->
<div class="input-underline">
<label class="block font-label-sm text-label-sm text-on-surface-variant mb-2" for="password">Password</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-0 text-on-surface-variant text-lg">lock</span>
<input class="w-full bg-transparent border-0 border-b border-glass-border text-on-surface pl-8 pr-10 py-3 focus:ring-0 focus:border-transparent placeholder-on-surface-variant/50 font-body-md text-body-md" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-0 text-on-surface-variant hover:text-champagne-gold transition-colors p-2 flex items-center justify-center" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-lg" id="visibility_icon">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-champagne-gold text-obsidian font-label-sm text-label-sm uppercase tracking-widest py-4 rounded DEFAULT ambient-glow-active transition-all duration-300 hover:opacity-90 flex items-center justify-center gap-2 mt-4" type="submit">
<span>Sign In</span>
<span class="material-symbols-outlined text-sm">arrow_forward</span>
</button>
</form>
</div>
<!-- Footer Link -->
<div class="mt-12">
<a class="font-label-sm text-label-sm text-on-surface-variant hover:text-champagne-gold transition-colors flex items-center gap-2 group" href="#">
<span class="material-symbols-outlined text-sm group-hover:-translate-x-1 transition-transform">arrow_back</span>
<span>Return to Landing</span>
</a>
</div>
</main>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const visibilityIcon = document.getElementById('visibility_icon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityIcon.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                visibilityIcon.textContent = 'visibility';
            }
        }
    </script>
</body></html>
