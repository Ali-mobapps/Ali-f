name: dynetix_app
description: "Dynetix Mobile App - Simplify. Connect. Grow."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  get_it: ^7.7.0
  equatable: ^2.0.5

  # Local Database & Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.4

  # Firebase & Authentication
  firebase_core: ^3.15.2
  firebase_auth: ^5.0.0
  firebase_messaging: ^15.0.0
  google_sign_in: ^6.3.0

  # Payment Integration & Network
  flutter_stripe: ^10.2.0
  dio: ^5.4.0

  # Utilities & UI
  google_fonts: ^6.3.3
  intl: ^0.20.2
  local_auth: ^2.3.0
  freezed_annotation: ^2.4.4

  # Added for Gallery Profile Picture Picker
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

flutter_launcher_icons:
  image_path: "assets/images/logo.png"
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/images/logo.png"