name: dynetix_app
description: "Dynetix Mobile App - Simplify. Connect. Grow."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  google_fonts: ^6.2.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  dio: ^5.8.0+1

  hive: ^2.2.3
  hive_flutter: ^1.1.0

  flutter_secure_storage: ^11.0.0

  shared_preferences: ^2.5.3

  supabase_flutter: ^2.8.3
  local_auth: ^3.0.2
  intl: ^0.20.2
  path_provider: ^2.1.5
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/icon/
