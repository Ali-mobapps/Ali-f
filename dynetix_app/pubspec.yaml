name: dynetix_app
description: "Dynetix Mobile App - Elite Professional Solutions"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  supabase_flutter: ^2.8.3
  intl: ^0.20.2
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  path_provider: ^2.1.5
  url_launcher: ^6.3.1
  open_filex: ^4.5.0
  fl_chart: ^0.70.2
  record: 5.1.0
  audioplayers: ^6.1.0
  firebase_core: ^3.4.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2
  googleapis_auth: ^1.6.0
  google_generative_ai: ^0.4.0
  pdf: ^3.11.1
  printing: ^5.13.2
  app_links: ^6.3.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dependency_overrides:
  record_platform_interface: 1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
